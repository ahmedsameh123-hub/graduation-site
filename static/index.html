<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Graduation</title>
  <meta name="theme-color" content="#0d1233">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 12 4 26l28 14 28-14z' fill='%23e6bf6a'/%3E%3Cpath d='M16 33v12c0 4 8 8 16 8s16-4 16-8V33l-16 8z' fill='%23e6bf6a'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,500;1,700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="is-locked">
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <div id="progress" aria-hidden="true"></div>
  <div class="beams" aria-hidden="true"><i></i><i></i></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <button id="lang-toggle" class="lang" type="button" hidden><span id="lang-label">EN</span></button>

  <!-- ============ INTRO (velvet curtains) ============ -->
  <section id="intro" class="intro" aria-live="polite">
    <div class="intro__half intro__half--l"></div>
    <div class="intro__half intro__half--r"></div>
    <div class="intro__content">
      <div class="seal" aria-hidden="true">
        <svg viewBox="0 0 64 64" class="cap-icon">
          <defs>
            <linearGradient id="gCap" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f7e5ae"/><stop offset="1" stop-color="#c8963f"/>
            </linearGradient>
          </defs>
          <path d="M32 12 4 26l28 14 28-14z" fill="url(#gCap)"/>
          <path d="M16 33v12c0 4 8 8 16 8s16-4 16-8V33l-16 8z" fill="url(#gCap)" opacity=".85"/>
          <path d="M56 28v16" stroke="url(#gCap)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="56" cy="47" r="3.2" fill="url(#gCap)"/>
        </svg>
      </div>
      <p id="intro-line" class="intro__line">...</p>
      <button id="open-btn" class="btn" type="button"><span id="open-btn-text">...</span></button>
      <p id="load-error" class="load-error" hidden></p>
    </div>
  </section>

  <button id="music-toggle" class="music" type="button" aria-label="Music" aria-pressed="false" hidden>
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- ============ SITE ============ -->
  <main id="site" class="site">

    <!-- HERO -->
    <header id="hero" class="hero">
      <div class="hero__inner">
        <div class="hero__photo anim" style="--i:0">
          <div class="halo" aria-hidden="true"></div>
          <div class="frame" id="hero-frame" role="img" aria-label="">
            <div class="frame__img" id="hero-img"></div>
          </div>
          <svg class="tassel" viewBox="0 0 48 150" aria-hidden="true">
            <defs>
              <linearGradient id="gTas" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f7e5ae"/><stop offset="1" stop-color="#b8893a"/>
              </linearGradient>
            </defs>
            <path d="M24 0v46" stroke="url(#gTas)" stroke-width="3" stroke-linecap="round"/>
            <circle cx="24" cy="50" r="7" fill="url(#gTas)"/>
            <path d="M13 58h22l4 18H9z" fill="url(#gTas)"/>
            <g stroke="url(#gTas)" stroke-width="2.4" stroke-linecap="round">
              <path d="M11 76 8 128M16 76l-3 60M21 76l-1 68M27 76l1 68M32 76l3 60M37 76l3 52"/>
            </g>
          </svg>
        </div>

        <div class="hero__text">
          <p id="hero-kicker" class="kicker anim" style="--i:1"></p>
          <h1 id="hero-title" class="hero__title anim" style="--i:2"></h1>
          <p id="hero-name" class="hero__name anim" style="--i:3"></p>
          <p id="hero-sub" class="hero__sub anim" style="--i:4"></p>
          <ul class="chips anim" style="--i:5">
            <li id="chip-uni"></li>
            <li id="chip-major"></li>
          </ul>
        </div>
      </div>
      <a href="#journey" class="scroll-hint anim" style="--i:6" aria-label="Scroll">
        <span id="scroll-hint-text"></span>
        <i aria-hidden="true"></i>
      </a>
    </header>

    <!-- JOURNEY -->
    <section id="journey" class="section">
      <div class="container">
        <div class="section__head">
          <h2 id="journey-title"></h2>
          <p id="journey-sub"></p>
        </div>
        <div id="stats" class="stats"></div>
        <ol id="timeline" class="timeline"></ol>
      </div>
    </section>

    <!-- AGE COUNTER -->
    <section id="age" class="section section--tint">
      <div class="container">
        <div class="section__head">
          <h2 id="age-title"></h2>
          <p id="age-sub"></p>
        </div>
        <div class="age">
          <p id="age-lead" class="age__lead"></p>
          <div id="age-ymd" class="age__ymd"></div>
          <div id="age-grid" class="age__grid"></div>
          <p id="age-foot" class="age__foot"></p>
        </div>
      </div>
    </section>

    <!-- TERMINAL -->
    <section id="terminal" class="section">
      <div class="container">
        <div class="section__head">
          <h2 id="terminal-title"></h2>
          <p id="terminal-sub"></p>
        </div>
        <div id="term" class="term">
          <div class="term__bar"><i></i><i></i><i></i><span id="term-title"></span></div>
          <div id="term-body" class="term__body"></div>
        </div>
      </div>
    </section>

    <!-- GALLERY -->
    <section id="gallery" class="section section--tint">
      <div class="container">
        <div class="section__head">
          <h2 id="gallery-title"></h2>
          <p id="gallery-sub"></p>
        </div>
      </div>
      <div id="strip" class="strip" hidden></div>
      <div class="container">
        <div id="gallery-grid" class="gallery"></div>
      </div>
    </section>

    <!-- THEN / NOW (only shows if static/images/then.jpg and now.jpg exist) -->
    <section id="thennow" class="section" hidden>
      <div class="container">
        <div class="section__head">
          <h2 id="thennow-title"></h2>
          <p id="thennow-sub"></p>
        </div>
        <div id="tn-box"></div>
      </div>
    </section>

    <!-- REASONS -->
    <section id="reasons" class="section section--tint">
      <div class="container">
        <div class="section__head">
          <h2 id="reasons-title"></h2>
          <p id="reasons-sub"></p>
        </div>
        <div id="reasons-grid" class="reasons"></div>
      </div>
    </section>

    <!-- BALLOONS -->
    <section id="balloons" class="section">
      <div class="container">
        <div class="section__head">
          <h2 id="balloons-title"></h2>
          <p id="balloons-sub"></p>
        </div>
        <div id="balloon-stage" class="balloons"></div>
        <p id="balloon-count" class="balloon-count"></p>
        <p id="balloon-done" class="balloon-done" hidden></p>
      </div>
    </section>

    <!-- SCRATCH CARD -->
    <section id="scratch" class="section section--tint">
      <div class="container">
        <div class="section__head">
          <h2 id="scratch-title"></h2>
          <p id="scratch-sub"></p>
        </div>
        <div id="scratch-card" class="scratch">
          <div id="scratch-under" class="scratch__under">
            <h3 id="scratch-reveal-title"></h3>
            <p id="scratch-reveal-text"></p>
          </div>
          <canvas id="scratch-canvas"></canvas>
        </div>
      </div>
    </section>

    <!-- LETTER -->
    <section id="letter" class="section section--letter">
      <div class="container container--narrow">
        <div class="paper-wrap">
          <article id="paper" class="paper">
            <h2 id="letter-title" class="paper__title"></h2>
            <p id="letter-greeting" class="paper__greeting"></p>
            <div id="letter-body" class="paper__body"></div>
            <p id="letter-closing" class="paper__closing"></p>
            <p id="letter-signature" class="paper__signature"></p>
            <p id="letter-ps" class="paper__ps"></p>
            <button id="wax" class="wax" type="button" aria-expanded="false">
              <span id="wax-letter" class="wax__letter"></span>
              <span id="wax-hint" class="wax__hint"></span>
            </button>
          </article>
        </div>
      </div>
    </section>

    <!-- FINALE -->
    <section id="finale" class="section finale">
      <div class="container container--narrow">
        <h2 id="finale-title" class="finale__title"></h2>
        <p id="finale-text" class="finale__text"></p>
        <div class="finale__actions">
          <button id="celebrate-btn" class="btn" type="button"><span id="celebrate-text"></span></button>
          <button id="top-btn" class="btn btn--ghost" type="button"><span id="top-text"></span></button>
        </div>
      </div>
      <footer id="footer" class="footer"></footer>
    </section>
  </main>

  <!-- ============ LIGHTBOX ============ -->
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true">
    <button class="lb__btn lb__close" type="button" aria-label="Close">&times;</button>
    <button class="lb__btn lb__play" type="button" aria-label="Autoplay" aria-pressed="false"><span aria-hidden="true">&#9654;</span></button>
    <button class="lb__btn lb__prev" type="button" aria-label="Previous">&#8249;</button>
    <button class="lb__btn lb__next" type="button" aria-label="Next">&#8250;</button>
    <figure class="lb__figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <div id="lb-count" class="lb__count"></div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="/static/js/script.js" defer></script>
</body>
</html>
